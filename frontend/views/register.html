<div class="container py-5">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <div class="card border-0 shadow-lg">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="text-primary mb-3">
              <i class="fas fa-heartbeat fa-2x" aria-hidden="true"></i>
            </div>
            <h1 class="h4 text-gray-900 mb-2">Create your account</h1>
            <p class="text-muted mb-0">Start building healthier habits with FitPulse.</p>
          </div>

          <form>
            <div class="mb-3">
              <label for="registerName" class="form-label">Full name</label>
              <input type="text" class="form-control" id="registerName" name="name"
                autocomplete="name" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
              <label for="registerEmail" class="form-label">Email address</label>
              <input type="email" class="form-control" id="registerEmail" name="email"
                autocomplete="email" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
              <label for="registerPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="registerPassword" name="password"
                autocomplete="new-password" placeholder="Create a password" required>
            </div>

            <div class="mb-4">
              <label for="registerPasswordConfirmation" class="form-label">Confirm password</label>
              <input type="password" class="form-control" id="registerPasswordConfirmation"
                name="passwordConfirmation" autocomplete="new-password"
                placeholder="Repeat your password" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Create account</button>
          </form>

          <p class="text-center text-muted small mt-4 mb-0">
            Already have an account?
            <a href="login.html">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
