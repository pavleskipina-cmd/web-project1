<div class="container-fluid">
  <div class="d-sm-flex align-items-center justify-content-between mb-4">
    <div>
      <h1 class="h3 mb-1 text-gray-800">Dashboard</h1>
      <p class="mb-0 text-muted">Here is your fitness overview for today.</p>
    </div>
    <a href="#workouts" class="btn btn-primary shadow-sm">
      <i class="fas fa-plus fa-sm text-white-50 me-2"></i>Log workout
    </a>
  </div>

  <div class="row">
    <div class="col-xl-4 col-md-6 mb-4">
      <div class="card border-left-primary shadow h-100 py-2">
        <div class="card-body">
          <div class="row g-0 align-items-center">
            <div class="col me-2">
              <div class="text-xs font-weight-bold text-primary text-uppercase mb-1">Total workouts</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800">12</div>
              <small class="text-success"><i class="fas fa-arrow-up me-1"></i>8% this month</small>
            </div>
            <div class="col-auto"><i class="fas fa-dumbbell fa-2x text-gray-300"></i></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-xl-4 col-md-6 mb-4">
      <div class="card border-left-success shadow h-100 py-2">
        <div class="card-body">
          <div class="row g-0 align-items-center">
            <div class="col me-2">
              <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Calories logged</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800">18,450 kcal</div>
              <small class="text-muted">This month</small>
            </div>
            <div class="col-auto"><i class="fas fa-fire fa-2x text-gray-300"></i></div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-xl-4 col-md-6 mb-4">
      <div class="card border-left-info shadow h-100 py-2">
        <div class="card-body">
          <div class="row g-0 align-items-center">
            <div class="col me-2">
              <div class="text-xs font-weight-bold text-info text-uppercase mb-1">Active plans</div>
              <div class="h5 mb-0 font-weight-bold text-gray-800">3</div>
              <small class="text-muted">2 in progress</small>
            </div>
            <div class="col-auto"><i class="fas fa-clipboard-list fa-2x text-gray-300"></i></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-xl-8 col-lg-7 mb-4">
      <div class="card shadow h-100">
        <div class="card-header py-3 d-flex align-items-center justify-content-between">
          <h6 class="m-0 font-weight-bold text-primary">Weekly activity</h6>
          <span class="badge bg-light text-primary">Chart placeholder</span>
        </div>
        <div class="card-body">
          <canvas class="w-100" height="180" aria-label="Weekly activity chart placeholder"></canvas>
        </div>
      </div>
    </div>
    <div class="col-xl-4 col-lg-5 mb-4">
      <div class="card shadow h-100">
        <div class="card-header py-3">
          <h6 class="m-0 font-weight-bold text-primary">Macro balance</h6>
        </div>
        <div class="card-body">
          <canvas class="w-100" height="180" aria-label="Macro balance chart placeholder"></canvas>
          <p class="small text-muted text-center mb-0">Chart integration will be added later.</p>
        </div>
      </div>
    </div>
  </div>
</div>
