<div class="container py-5">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5 col-xl-4">
      <div class="card border-0 shadow-lg">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="text-primary mb-3">
              <i class="fas fa-heartbeat fa-2x" aria-hidden="true"></i>
            </div>
            <h1 class="h4 text-gray-900 mb-2">Welcome back</h1>
            <p class="text-muted mb-0">Sign in to continue to FitPulse.</p>
          </div>

          <form>
            <div class="mb-3">
              <label for="loginEmail" class="form-label">Email address</label>
              <input type="email" class="form-control" id="loginEmail" name="email"
                autocomplete="email" placeholder="name@example.com" required>
            </div>

            <div class="mb-3">
              <label for="loginPassword" class="form-label">Password</label>
              <input type="password" class="form-control" id="loginPassword" name="password"
                autocomplete="current-password" placeholder="Enter your password" required>
            </div>

            <div class="d-flex justify-content-end mb-4">
              <a class="small" href="#forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-100">Sign in</button>
          </form>

          <p class="text-center text-muted small mt-4 mb-0">
            New to FitPulse?
            <a href="#register">Create an account</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
