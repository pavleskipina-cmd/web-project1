<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitPulse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet">
  <link href="css/sb-admin-2.css" rel="stylesheet">
  <link href="css/spapp.css" rel="stylesheet">
</head>
<body id="page-top">
  <div id="app-shell">
    <div id="wrapper">
      <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
        <a class="sidebar-brand d-flex align-items-center justify-content-center" href="#dashboard">
          <div class="sidebar-brand-icon rotate-n-15">
            <i class="fas fa-heartbeat"></i>
          </div>
          <div class="sidebar-brand-text mx-3">FitPulse</div>
        </a>

        <hr class="sidebar-divider my-0">

        <li class="nav-item">
          <a class="nav-link" href="#dashboard">
            <i class="fas fa-fw fa-tachometer-alt"></i>
            <span>Dashboard</span>
          </a>
        </li>

        <hr class="sidebar-divider">
        <div class="sidebar-heading">Fitness</div>

        <li class="nav-item">
          <a class="nav-link" href="#workouts">
            <i class="fas fa-fw fa-dumbbell"></i>
            <span>Workouts</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#exercises">
            <i class="fas fa-fw fa-running"></i>
            <span>Exercises</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#nutrition">
            <i class="fas fa-fw fa-utensils"></i>
            <span>Nutrition</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#reviews">
            <i class="fas fa-fw fa-star"></i>
            <span>Reviews</span>
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#profile">
            <i class="fas fa-fw fa-user"></i>
            <span>Profile</span>
          </a>
        </li>

        <hr class="sidebar-divider d-none d-md-block">
        <div class="text-center d-none d-md-inline">
          <button class="rounded-circle border-0" id="sidebarToggle" type="button" aria-label="Toggle sidebar"></button>
        </div>
      </ul>

      <div id="content-wrapper" class="d-flex flex-column">
        <div id="content">
          <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
            <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle me-3" type="button" aria-label="Toggle sidebar">
              <i class="fa fa-bars"></i>
            </button>

            <span class="navbar-text fw-bold text-gray-800">Fitness dashboard</span>

            <ul class="navbar-nav ms-auto">
              <li class="nav-item dropdown no-arrow">
                <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                  <span class="me-2 d-none d-lg-inline text-gray-600 small">User</span>
                  <i class="fas fa-user-circle fa-fw"></i>
                </a>
                <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userDropdown">
                  <li><a class="dropdown-item" href="#login">Log out</a></li>
                </ul>
              </li>
            </ul>
          </nav>

          <main id="spapp" role="main">
            <section id="dashboard" data-load="dashboard.html"></section>
            <section id="workouts" data-load="workouts.html"></section>
            <section id="exercises" data-load="exercises.html"></section>
            <section id="nutrition" data-load="nutrition.html"></section>
            <section id="reviews" data-load="reviews.html"></section>
            <section id="profile" data-load="profile.html"></section>
            <section id="login" data-load="login.html"></section>
            <section id="register" data-load="register.html"></section>
            <section id="forgot-password" data-load="forgot-password.html"></section>
            <section id="admin" data-load="admin.html"></section>
          </main>
        </div>
      </div>
    </div>
  </div>

  <noscript>
    <p>JavaScript is required to use this application.</p>
  </noscript>

  <script src="vendor/jquery/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="vendor/jquery-easing/jquery.easing.min.js"></script>
  <script src="js/sb-admin-2.min.js"></script>
  <script src="js/jquery.spapp.min.js"></script>
  <script src="js/routing.js"></script>
</body>
</html>
